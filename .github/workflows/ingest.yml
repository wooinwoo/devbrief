name: Ingest

# 수집·요약·임베딩·영상분석을 GitHub Actions 에서 Redis/HTTP 서버 없이 직접 실행한다.
# CLI(node apps/api/dist/cli.js)가 Neon DB 에 직접 쓰기 — 서빙(web/api)은 별도에서 읽기만.
on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: '실행할 CLI command'
        required: true
        default: collect
        type: choice
        options:
          - collect
          - repair-summaries
          - all
          - ingest
          - reanalyze
          - extract
          - repos
          - videos
          - digest
          - conferences
          - conference-images
      limit:
        description: Maximum summary repairs / article bodies / event images
        type: string
        default: '200'
      prepare_schema:
        description: Apply pending migrations after a verified Neon backup
        type: boolean
        default: false

# 직전 실행이 안 끝났으면 취소하지 말고 줄세움 (DB 쓰기 충돌 방지)
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: collect · summarize · embed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # 배치 실패의 원인 로그 다수가 debug 레벨 — Actions 에서는 debug 를 켠다 (cli.ts resolveLogLevels)
      LOG_LEVEL: debug
      # 수동 실행(workflow_dispatch)이면 선택한 command, 스케줄이면 all
      COMMAND: ${{ github.event.inputs.command || 'collect' }}
      LIMIT: ${{ inputs.limit || '200' }}
    steps:
      # 미정의 secret 은 Actions 가 빈 문자열로 주입한다 — 회전 실수/오타를 여기서 빨간불로 만든다.
      # (CLI 도 부트 전에 같은 검증을 하지만, install/build 전에 즉시 실패하는 편이 빠르다)
      - name: Preflight (secrets 검증)
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error title=Preflight::DATABASE_URL secret 이 비어 있습니다"; exit 1; }
          case "$COMMAND" in
            all|reanalyze)
              [ -n "$GEMINI_API_KEY" ] || { echo "::error title=Preflight::GEMINI_API_KEY secret 이 비어 있습니다 (command=$COMMAND 에 필수)"; exit 1; }
              ;;
          esac
          [ -n "$YOUTUBE_API_KEY" ] || echo "::warning title=Preflight::YOUTUBE_API_KEY 미설정 — 공개 영상 RSS를 사용합니다"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @devbrief/db의 main이 src/index.ts(TS 원본)라 런타임 require 시
          # Node의 strip-types가 필요. 24는 이를 안정 지원(Dockerfile과 동일 버전).
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @devbrief/db run generate

      - name: Prepare legacy schema (manual recovery only)
        if: inputs.prepare_schema == true
        run: |
          node scripts/database-audit.mjs prepare
          pnpm db:migrate:deploy

      - name: Database counts before collection
        run: node scripts/database-audit.mjs

      - name: Build API
        run: pnpm --filter @devbrief/api run build

      - name: Verify CLI failure propagation
        run: |
          set +e
          node -e 'process.exit(7)' | tee /tmp/exit-code-check.log
          result=$?
          set -e
          test "$result" -eq 7

      - name: Run CLI
        id: cli
        # tee 로 로그 사본을 남겨 아래 Summary/알림 스텝에서 재사용.
        # (Actions 기본 bash 는 -o pipefail 이라 CLI 실패가 tee 뒤로도 전파된다)
        run: node apps/api/dist/cli.js "$COMMAND" --limit "$LIMIT" 2>&1 | tee /tmp/cli.log

      # run 목록에서 클릭 한 번으로 스텝별 결과/실패를 확인 (성공/실패 무관하게 기록)
      - name: Database counts after collection
        if: always()
        run: node scripts/database-audit.mjs

      - name: Step summary
        if: always()
        env:
          CLI_OUTCOME: ${{ steps.cli.outcome }}
        run: |
          {
            echo "## Ingest 결과 — command=\`$COMMAND\` (cli: $CLI_OUTCOME)"
            echo ""
            echo '```text'
            if [ -f /tmp/cli.log ]; then
              grep -aE '✔|✖|실패|전멸|· ' /tmp/cli.log | tail -n 60 || echo '(요약 라인 없음)'
            else
              echo '(CLI 미실행 — 이전 스텝 실패)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CLI_OUTCOME" != "success" ] && [ -f /tmp/cli.log ]; then
            echo "::group::실패 관련 로그 (ERROR/WARN)"
            grep -aE 'ERROR|WARN|실패|✖' /tmp/cli.log || true
            echo "::endgroup::"
          fi

      # SLACK_WEBHOOK_URL secret 이 있으면 실패 알림, 없으면 조용히 skip
      - name: Notify Slack (실패 시)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 skip"
            exit 0
          fi
          FIRST_FAIL=$( { [ -f /tmp/cli.log ] && grep -aE '실패|✖|ERROR' /tmp/cli.log | head -n 1 | tr -d '"\\' | cut -c1-200; } || true )
          payload=$(printf '{"text":"devbrief ingest 실패 — command=%s\\n%s\\n%s"}' "$COMMAND" "$RUN_URL" "$FIRST_FAIL")
          curl -sf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" \
            || echo "::warning title=Slack::알림 전송 실패"
