name: Uptime check

# API가 Cloudflare Worker로 옮겨져 더 이상 깨울 서버가 없다.
# 대신 하루 두 번 사이트와 API·DB가 응답하는지 확인하고, 실패하면 실행을 빨간불로 남긴다.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Site and API health
        run: |
          set -u
          fail=0
          for url in \
            "https://devbrief.wooki.cc/" \
            "https://devbrief-api.wooin1001.workers.dev/health/db" \
            "https://devbrief.wooki.cc/api/public/articles?limit=1"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
            echo "$url -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error title=Uptime::$url 응답 $code"
              fail=1
            fi
          done
          exit "$fail"
