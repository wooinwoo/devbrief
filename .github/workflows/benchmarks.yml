name: Refresh LLM benchmarks

on:
  schedule:
    # Daily 09:20 KST, separate from article ingestion.
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # benchmark-data 브랜치에 결과를 push하는 이 job만 쓰기 권한을 가진다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Test parser and failure preservation
        run: node --test scripts/refresh-benchmarks.test.mjs
      - name: Checkout last published data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: benchmark-data
          path: benchmark-feed
      - name: Refresh verified snapshot
        run: node scripts/refresh-benchmarks.mjs benchmark-feed/llm-benchmarks.json
      - name: Publish data without rebuilding the app
        working-directory: benchmark-feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llm-benchmarks.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh verified LLM benchmarks"
          git push origin HEAD:benchmark-data
