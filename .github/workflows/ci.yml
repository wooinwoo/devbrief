name: CI

on:
  push:
    branches: [main]
  pull_request:

# 동일 ref 의 이전 실행은 취소 (PR 푸시 연타 시 자원 절약)
# 기본은 읽기 전용. 필요한 권한은 job에서만 연다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DB / Redis / 외부 서비스 없이 통과해야 한다.
    # Prisma generate · Next build 가 참조하는 더미 값만 주입한다 (실제 연결 없음).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (api)
        run: pnpm --filter @devbrief/api test

      - name: Test benchmark collection
        run: node --test scripts/refresh-benchmarks.test.mjs

      - name: Test (web)
        run: pnpm --filter @devbrief/web test

      - name: Build
        run: pnpm build
