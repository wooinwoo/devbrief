name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 동일 ref 의 이전 실행은 취소 (PR 푸시 연타 시 자원 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # DB / Redis / 외부 서비스 없이 통과해야 한다.
    # Prisma generate · Next build 가 참조하는 더미 값만 주입한다 (실제 연결 없음).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (api)
        run: pnpm --filter @devbrief/api test

      - name: Test (web)
        run: pnpm --filter @devbrief/web test

      - name: Build
        run: pnpm build
