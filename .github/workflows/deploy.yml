name: Deploy

# master에 들어온 커밋이 CI를 통과하면 Cloudflare에 배포한다.
#  - apps/edge-api → Worker(devbrief-api)
#  - apps/web      → Pages(devbrief)
# 배포 토큰은 Pages·Workers 쓰기 권한만 가진 전용 토큰이며 production environment에만 둔다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # CI가 성공했고, 외부 fork가 아닌 이 저장소의 push에서 시작된 경우만 배포한다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_API_BASE: https://devbrief-api.wooin1001.workers.dev/api/v1
    steps:
      - name: Checkout (CI를 통과한 커밋)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API worker
        run: pnpm --filter @devbrief/edge-api run build

      - name: Build web
        run: pnpm --filter @devbrief/web run build:pages

      - name: Deploy API worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy --config apps/edge-api/wrangler.toml

      - name: Deploy web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          npx --yes wrangler@4.158.0 pages deploy apps/web/dist/pages
          --project-name devbrief --branch master --no-bundle
          --commit-hash "$COMMIT_SHA"

      - name: Smoke test
        run: |
          for url in "https://devbrief-api.wooin1001.workers.dev/health/db" "https://devbrief.wooki.cc/api/public/articles?limit=1"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo "000")
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done
